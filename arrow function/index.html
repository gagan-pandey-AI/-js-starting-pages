<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Arrow Functions</title>

    <script src="first.js" defer></script>
</head>

<body>

    <h1>My JavaScript Practice</h1>

    <h2>1. Square Calculator</h2>

    <p>Calculate the square of a number.</p>

    <button onclick="console.log('Square of 5:', square(5))">
        Calculate Square
    </button>

    <h2>2. Greeting Function</h2>

    <p>Click the button to display a welcome message.</p>

    <button onclick="greet('Gagan Pandey')">
        Say Hello
    </button>

    <h2>3. Cube Calculator</h2>

    <p>Calculate the cube of a number.</p>

    <button onclick="console.log('Cube of 3:', cube(3))">
        Calculate Cube
    </button>

</body>

</html>
